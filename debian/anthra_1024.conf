# Options for the anthra_1024 skin (VDR text2skin plugin), make syntax.
# After changes run: vdr-skin-anthra-update anthra_1024
# and restart VDR. Escape slashes in paths with backslashes.

###### SKINOPTIONS:


###### to comment an option just place a '#' at the beginning of the line
###### to uncomment an option please remove the leading '#'
###### !!! Take care to uncomment only ONE option for CHANNELLOGOS !!!

###### CHANNELLOGOS ######
#NOLOGOS = 1
LOGOSLEFT = 1

###### path to the channellogos, escape slashes with backslashes! ######
###### e.g. CHANNELLOGOSPATH = \/etc\/vdr\/plugins\/text2skin\/liquid-logos4anthra_HD #####
CHANNELLOGOSPATH=\/var\/lib\/vdr\/anthralogos

###### MENULOGOS
MENULOGOS = 1

###### EPGIMAGES ######
EPGIMAGES = 1

###### path to the epgimages, escape slashes with backslashes! ######
###### e.g. EPGIMAGESPATH = \/etc\/vdr\/plugins\/tvm2vdr\/epgimages ######
EPGIMAGESPATH=\/var\/cache\/vdr\/epgimages

###### EPGIMAGESFORMAT #####
####### default EPGIMAGESFORMAT is png, uncomment the following line, if you have jpgs ######
#EPGIMAGESJPG = 1

###### TIMER-INFO_MAIN-MENU
#TIMER-INFO_MAIN-MENU = 1

###### TIMER-INFO_MAIN-MENU_BLINK
###### current recordings are blinking red
TIMER-INFO_MAIN-MENU_BLINK = 1

##### NOMARQUEE ######
NOMARQUEE = 1


